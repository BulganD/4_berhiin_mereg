<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#e7f3fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="君に">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="stylesheet" href="style.css">
  <title>将来を知ろう！</title>
</head>
<body>
  <main class="app">
    <header><h1>将来を知ろう！</h1><p id="hint">ボタンを押すか、スマホを振ってね</p></header>
    <section class="play-area" aria-label="4つのshagai">
      <div class="pieces">
        <img id="piece-0" alt="">
        <img id="piece-1" alt="">
        <img id="piece-2" alt="">
        <img id="piece-3" alt="">
      </div>
    </section>
    <button id="draw" type="button">将来を知ろう</button>
    <section class="fortune-card" aria-live="polite">
      <p id="fortune">ボタンを押すと、今日のメッセージが出ます。</p>
    </section>
    <footer>ふって占うときは、スマホをしっかり持ってね</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
